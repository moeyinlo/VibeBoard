[workspace]
resolver = "2"
members = ["crates/vibeboard-core", "crates/vibeboard-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.release.package.vibeboard-core]
opt-level = 3

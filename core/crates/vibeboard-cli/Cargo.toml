[package]
name = "vibeboard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless VibeBoard core harness: device link, auth and (later) transcription smoke tests"

[[bin]]
name = "vibeboard"
path = "src/main.rs"

[features]
default = ["whisper"]
whisper = ["vibeboard-core/whisper"]
whisper-metal = ["whisper", "vibeboard-core/whisper-metal"]
whisper-cuda = ["whisper", "vibeboard-core/whisper-cuda"]
whisper-vulkan = ["whisper", "vibeboard-core/whisper-vulkan"]

[dependencies]
vibeboard-core = { path = "../vibeboard-core" }
log = "0.4"
env_logger = "0.11"
serde_json = "1"

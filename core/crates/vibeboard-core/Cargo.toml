[package]
name = "vibeboard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform-neutral VibeBoard protocol, device link, auth and ASR orchestration"

[lib]
name = "vibeboard_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
# Local offline recognition; brings in whisper-rs and a native runtime.
whisper = ["dep:whisper-rs"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
serialport = "4"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
audiopus = "0.2"
whisper-rs = { version = "0.13", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation"] }

[dev-dependencies]
env_logger = "0.11"

[package.metadata.docs.rs]
all-features = false

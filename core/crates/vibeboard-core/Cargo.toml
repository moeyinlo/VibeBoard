[package]
name = "vibeboard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform-neutral VibeBoard protocol, device link, auth and ASR orchestration"

[lib]
name = "vibeboard_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
# Local offline recognition is on by default; disable with --no-default-features.
default = ["whisper"]
whisper = ["dep:whisper-rs"]
# Hardware acceleration backends (opt-in: they need the matching toolchain/SDK).
whisper-metal = ["whisper", "whisper-rs/metal"]
whisper-cuda = ["whisper", "whisper-rs/cuda"]
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]
whisper-coreml = ["whisper", "whisper-rs/coreml"]

[dependencies]
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
serialport = "4"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
audiopus = "0.2"
whisper-rs = { version = "0.16", optional = true, features = ["log_backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
env_logger = "0.11"

[package.metadata.docs.rs]
all-features = false
